<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#14122B">
<title>말씀잔치 2027</title>
<meta name="description" content="대림절 2026부터 왕이신 그리스도 주일 2027까지, 52주일 본문을 신학적·주석적·목회적·설교적 관점으로 만나는 말씀잔치.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="말씀잔치">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="말씀잔치 2027">
<meta property="og:description" content="대림절 2026 – 왕이신 그리스도 주일 2027, 52주일 말씀을 네 가지 관점으로.">
<meta property="og:url" content="https://ksk0203-oss.github.io/word-feast/2027/index.html">
<meta property="og:image" content="https://ksk0203-oss.github.io/word-feast/2027/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ksk0203-oss.github.io/word-feast/2027/assets/og.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<section id="cover">
  <header class="hero">
    <button class="theme-toggle" id="themeBtn" aria-label="화면 모드 전환">◐</button>
    <div class="hero-in">
      <span class="pill"><i></i>대림절 2026 – 왕이신 그리스도 주일 2027</span>
      <h1><span>말씀</span><span>잔치 2027</span></h1>
      <p class="lead">매 주일, 신학적·주석적·목회적·설교적 네 가지 관점으로 만나는 말씀. 대림절 첫 주일부터 한 해의 교회력을 따라갑니다.</p>
      <div class="stats">
        <div class="stat"><b id="statN">52</b><small>주일 본문</small></div>
        <div class="stat"><b>4</b><small>관점 해설</small></div>
        <div class="stat"><b>Mk</b><small>마가복음의 해</small></div>
      </div>
    </div>
  </header>
  <main class="toc">
    <p class="toc-guide">아래 목차에서 원하시는 주일을 선택해 주세요.</p>
    <div class="legend" id="legend"></div>
    <div class="toc-layout">
      <nav class="mnav" id="monthNav" aria-label="월별 바로가기"></nav>
      <div id="months"></div>
    </div>
  </main>
</section>
<button class="fab" id="fab" aria-label="맨 위로">↑</button>
<div class="track" id="track"><div class="thumb" id="thumb"></div></div>
<script src="assets/app.js"></script>
<script>
var ORD=['첫번째주','두번째주','세번째주','네번째주','다섯번째주'];
(function(){
  var lg='';['advent','christmas','epiphany','lent','holy','easter','pentecost','ordinary','king'].forEach(function(k){lg+='<span class="chip" data-s="'+k+'">'+SEAS[k]+'</span>'});
  $('legend').innerHTML=lg;
  fetch('data/toc.json').then(function(r){return r.json()}).then(function(DATA){
    $('statN').textContent=DATA.length;
    var groups={},order=[];
    DATA.forEach(function(e){var d=pd(e.date),key=d.getFullYear()+'-'+(d.getMonth()+1);if(!groups[key]){groups[key]=[];order.push(key)}groups[key].push(e)});
    var h='';
    order.forEach(function(key){
      var p=key.split('-'),list=groups[key];
      h+='<div class="month" id="m-'+key+'"><div class="month-head"><h2><em>'+p[1]+'월</em></h2><span>'+p[0]+'</span></div><div class="grid">';
      list.forEach(function(e){
        var d=pd(e.date),wk=ORD[Math.floor((d.getDate()-1)/7)];
        h+='<a class="card" data-s="'+e.season+'" href="sermon/detail.html?id='+encodeURIComponent(e.id)+'">'+
          '<div class="top"><span class="wk">'+wk+'</span><span class="num">'+e.id+'</span></div>'+
          (e.greek_id?'<span class="grbox" role="link" tabindex="0" title="헬라어 원어 강해 보기" aria-label="헬라어 원어 강해 보기" onclick="event.stopPropagation();event.preventDefault();location.href=\'greek/detail.html?id='+encodeURIComponent(e.greek_id)+'\'" onkeydown="if(event.key===\'Enter\'){event.stopPropagation();event.preventDefault();location.href=\'greek/detail.html?id='+encodeURIComponent(e.greek_id)+'\'}"><b>GR</b><small>원어</small></span>':'')+
          '<div class="date">'+(d.getMonth()+1)+'.'+d.getDate()+'<small>'+WD[d.getDay()]+'</small></div>'+
          '<div class="nm">'+esc(e.name)+'</div>'+
          '<div class="sc"><b>'+esc(e.book)+'</b> '+esc(e.passage)+'</div></a>';
      });
      h+='</div></div>';
    });
    $('months').innerHTML=h;
    /* monthly index: left column on desktop, sticky top bar on mobile */
    var nav=$('monthNav'),nh='';
    order.forEach(function(key){var p=key.split('-');nh+='<a href="#m-'+key+'" data-m="m-'+key+'"><b>'+p[1]+'월</b></a>'});
    nav.innerHTML=nh;
    var items=nav.querySelectorAll('a');
    function setActive(id){
      items.forEach(function(a){var on=a.dataset.m===id;a.classList.toggle('on',on);if(on){a.setAttribute('aria-current','true');if(nav.scrollWidth>nav.clientWidth){nav.scrollTo({left:a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2,behavior:'smooth'})}}else a.removeAttribute('aria-current')});
    }
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)setActive(en.target.id)})},{rootMargin:'-18% 0px -72% 0px'});
      document.querySelectorAll('.month').forEach(function(m){io.observe(m)});
    }
    setActive('m-'+order[0]);
    var back=sessionStorage&&sessionStorage.getItem('wf27-last');
    if(back){var el=document.querySelector('a.card[href$="id='+back+'"]');if(el)el.scrollIntoView({block:'center'})}
    syncThumb();
  }).catch(function(){$('months').innerHTML='<p style="padding:24px">목차를 불러오지 못했습니다.</p>'});
})();
</script>
</body>
</html>
