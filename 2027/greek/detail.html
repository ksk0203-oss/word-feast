<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#14122B">
<title>헬라어 원어 강해 — 말씀잔치 2027</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="말씀잔치">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="헬라어 원어 강해 — 말씀잔치 2027">
<meta property="og:description" content="주일 본문을 헬라어 원어로 한 절씩 살피고, 새번역·새한글·KJV·ASV 번역과 함께 읽습니다.">
<meta property="og:image" content="https://ksk0203-oss.github.io/word-feast/2027/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ksk0203-oss.github.io/word-feast/2027/assets/og.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<section id="detail">
  <div class="bar" id="bar">
    <div class="bar-in">
      <div class="tg">
        <span class="lb">글씨크기</span>
        <button class="fs-btn" data-fs="0.9" style="font-size:12px">가</button>
        <button class="fs-btn on" data-fs="1" style="font-size:15px">가</button>
        <button class="fs-btn" data-fs="1.12" style="font-size:18px">가</button>
      </div>
      <div class="tg">
        <button class="voice" id="voiceBtn">▶ 듣기</button>
        <button class="rate-btn on" data-r="1">1×</button>
        <button class="rate-btn" data-r="1.25">1.25×</button>
        <button class="rate-btn" data-r="1.5">1.5×</button>
      </div>
    </div>
  </div>
  <div id="dContent"></div>
</section>
<button class="fab" id="fab" aria-label="맨 위로">↑</button>
<div class="track" id="track"><div class="thumb" id="thumb"></div></div>
<script src="../assets/app.js"></script>
<script>
var TRANS_ORDER=['새번역','새한글','NIV','KJV','ASV'];
(function(){
  var id=new URLSearchParams(location.search).get('id');
  Promise.all([
    fetch('../data/greek.json').then(function(r){return r.json()}),
    fetch('../data/toc.json').then(function(r){return r.json()}).catch(function(){return []})
  ]).then(function(res){
    var all=res[0],toc=res[1]||[];
    var g=all.find(function(x){return x.id===id});
    if(!g){$('dContent').innerHTML='<div class="d-hero"><div class="d-hero-in"><div class="nav-row"><a class="back" href="../index.html">← 목차</a></div><p class="d-cap">해당 강해를 찾을 수 없습니다.</p></div></div>';return}
    var t=toc.find(function(x){return x.greek_id===id});
    var d=t?pd(t.date):null;
    document.title='헬라어 원어 강해 · '+g.scripture+' — 말씀잔치 2027';
    if(t)$('detail').setAttribute('data-s',t.season);
    var sermonHref=t?'../sermon/detail.html?id='+encodeURIComponent(t.id):'';
    var cards='';
    g.verses.forEach(function(v){
      var tr='';
      if(v.translations&&v.translations.length){
        var by={};v.translations.forEach(function(x){by[x.label]=x.text});
        var rows='';
        TRANS_ORDER.forEach(function(l){if(by[l])rows+='<div class="trans-row"><span class="trans-label">'+esc(l)+'</span><span class="trans-text">'+esc(by[l])+'</span></div>'});
        if(rows)tr='<div class="trans-block">'+rows+'</div>';
      }
      cards+='<article class="gcard"><span class="gnum">'+esc(v.num)+'</span>'+
        '<p class="greek-text" lang="grc">'+esc(v.greek)+'</p>'+
        '<p class="greek-summary">'+esc(v.summary)+'</p>'+
        (v.note?'<p class="greek-note">'+esc(v.note)+'</p>':'')+tr+'</article>';
    });
    $('dContent').innerHTML=
      '<div class="d-hero" data-ghost="GR"><div class="d-hero-in">'+
        '<div class="nav-row"><a class="back" href="../index.html">← 목차</a><button class="prt" onclick="doPrint()">🖨 인쇄</button></div>'+
        '<p class="d-cap">헬라어 원어 강해'+(d?' · '+d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' ('+WD[d.getDay()]+')':'')+'</p>'+
        '<h2 class="d-title">'+esc(g.week)+'</h2><p class="d-scr">'+esc(g.scripture)+'</p></div></div>'+
      '<div class="d-body" id="ttsScope" style="margin-top:-28px">'+
        (sermonHref?'<a class="gr" href="'+sermonHref+'"><i>📖</i>이 주일 본문(해설)으로 돌아가기</a>':'')+
        cards+
        '<p class="g-credit">헬라어 본문: SBLGNT (Society of Biblical Literature · Faithlife, CC BY 4.0). 형태 분석은 MorphGNT(CC BY-SA 3.0)를 참고해 정리했습니다. KJV·ASV는 공유저작물(public domain)입니다.</p>'+
        '<div class="pager">'+(sermonHref?'<a href="'+sermonHref+'">‹ 본문으로</a>':'<span></span>')+'<a href="../index.html">목차로 ›</a></div>'+
      '</div>';
    window.scrollTo(0,0);syncThumb();
  }).catch(function(){$('dContent').innerHTML='<p style="padding:24px">불러오지 못했습니다.</p>'});
})();
</script>
</body>
</html>
