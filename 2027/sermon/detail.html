<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#14122B">
<title>말씀잔치 2027</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<section id="detail">
  <div class="bar" id="bar">
    <div class="bar-in">
      <div class="tg">
        <span class="lb">글씨크기</span>
        <button class="fs-btn" data-fs="0.9" style="font-size:12px">가</button>
        <button class="fs-btn on" data-fs="1" style="font-size:15px">가</button>
        <button class="fs-btn" data-fs="1.12" style="font-size:18px">가</button>
      </div>
      <div class="tg">
        <button class="voice" id="voiceBtn">▶ 듣기</button>
        <button class="rate-btn on" data-r="1">1×</button>
        <button class="rate-btn" data-r="1.25">1.25×</button>
        <button class="rate-btn" data-r="1.5">1.5×</button>
      </div>
    </div>
  </div>
  <div id="dContent"></div>
</section>
<button class="fab" id="fab" aria-label="맨 위로">↑</button>
<div class="track" id="track"><div class="thumb" id="thumb"></div></div>
<script src="../assets/app.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('id');
  try{sessionStorage.setItem('wf27-last',id)}catch(e){}
  fetch('../data/sermons.json').then(function(r){return r.json()}).then(function(all){
    var i=all.findIndex(function(e){return e.id===id});
    if(i<0){$('dContent').innerHTML='<div class="d-hero"><div class="d-hero-in"><div class="nav-row"><a class="back" href="../index.html">← 목차</a></div><p class="d-cap">해당 주일을 찾을 수 없습니다.</p></div></div>';return}
    var e=all[i],prev=all[i-1],next=all[i+1],d=pd(e.date);
    document.title=e.name+' — 말씀잔치 2027';
    $('detail').setAttribute('data-s',e.season);
    var body='';
    e.sections.forEach(function(s,n){body+='<article class="persp"><span class="badge"><b>'+(n+1)+'</b>'+esc(s.title)+'</span><div class="persp-body">'+s.html+'</div></article>'});
    $('dContent').innerHTML=
     '<div class="d-hero" data-ghost="'+(d.getMonth()+1)+'월"><div class="d-hero-in">'+
       '<div class="nav-row"><a class="back" href="../index.html">← 목차</a><button class="prt" onclick="doPrint()">🖨 인쇄</button></div>'+
       '<p class="d-cap">'+SEAS[e.season]+' · '+d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' ('+WD[d.getDay()]+')</p>'+
       '<h2 class="d-title">'+esc(e.name)+'</h2><p class="d-scr">'+esc(e.book)+' '+esc(e.passage)+'</p></div></div>'+
     '<div class="d-body" id="ttsScope" style="margin-top:-28px">'+body+
       '<div class="pager">'+(prev?'<a href="detail.html?id='+prev.id+'">‹ 이전 주일</a>':'<span></span>')+(next?'<a href="detail.html?id='+next.id+'">다음 주일 ›</a>':'<a href="../index.html">목차로 ›</a>')+'</div></div>';
    window.scrollTo(0,0);syncThumb();
  }).catch(function(){$('dContent').innerHTML='<p style="padding:24px">불러오지 못했습니다.</p>'});
})();
</script>
</body>
</html>
