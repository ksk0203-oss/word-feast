<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말씀잔치 — 참된평화를만드는사람들</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="topnav">
  <div class="brand">
    <span class="brand-badge">2026</span>
    <span class="brand-name">참된평화를만드는사람들</span>
  </div>
  <span class="nav-sub">말씀잔치</span>
</nav>

<div id="view-list">
  <div class="hero">
    <div class="ghost-word">Word</div>
    <div class="hero-inner">
      <p class="hero-caption">Word Feast · 2026</p>
      <h1 class="hero-title">말씀잔치</h1>
      <p class="hero-sub">성령강림절 후 열 번째 주일부터 왕이신 그리스도 주일까지,<br>신학적·주석적·목회적·설교적 관점으로 함께 나눕니다.</p>
    </div>
  </div>
  <div class="toc-wrap">
    <p class="toc-instruction">아래 목차에서 원하시는 주일을 선택해 주세요.</p>
    <div id="tocContainer">
      <p style="text-align:center; color:#8890A0; padding: 40px 0;">불러오는 중…</p>
    </div>
  </div>
  <footer class="site-footer">&copy; 2026 참된평화를만드는사람들 · 말씀잔치</footer>
</div>

<button class="fab-top" id="fabTop" onclick="scrollToTop()" aria-label="맨 위로">↑</button>
<div class="scroll-track" id="scrollTrack"><div class="scroll-thumb" id="scrollThumb"></div></div>

<script src="assets/app.js"></script>
<script>
var MONTH_LABELS = {"8":"8월","9":"9월","10":"10월","11":"11월","12":"12월"};
var ORDINAL_WEEK = ["첫번째주","두번째주","세번째주","네번째주","다섯번째주","여섯번째주","일곱번째주"];

function renderToc(items) {
  var months = {};
  var order = [];
  items.forEach(function(it){
    if (!months[it.month]) { months[it.month] = []; order.push(it.month); }
    months[it.month].push(it);
  });
  var html = "";
  order.forEach(function(mo){
    html += '<p class="toc-month-label">' + (MONTH_LABELS[mo] || (mo + '월')) + '</p><div class="toc-grid">';
    months[mo].forEach(function(it, wk){
      var wkLabel = ORDINAL_WEEK[wk] || ((wk+1) + '번째주');
      var sticker = it.greek_id
        ? '<span class="sticker-icon" onclick="event.stopPropagation(); event.preventDefault(); window.location.href=\'greek/detail.html?id=' + encodeURIComponent(it.greek_id) + '\';" title="헬라어 원어 강해 보기">GR</span>'
        : '';
      html += '<a class="toc-card" href="sermon/detail.html?id=' + encodeURIComponent(it.id) + '">' +
        sticker +
        '<span class="toc-line">' +
          '<span class="toc-num">' + esc(wkLabel) + '</span>' +
          '<span class="toc-date">' + esc(it.date) + '</span>' +
          '<span class="toc-scripture-bold">' + esc(it.scripture) + '</span>' +
        '</span>' +
        '<span class="toc-arrow">→</span>' +
      '</a>';
    });
    html += '</div>';
  });
  document.getElementById('tocContainer').innerHTML = html;
}

fetch('data/toc.json')
  .then(function(r){ return r.json(); })
  .then(renderToc)
  .catch(function(){
    document.getElementById('tocContainer').innerHTML = '<p style="text-align:center;color:#8890A0;">목차를 불러오지 못했습니다.</p>';
  });
</script>

</body>
</html>
